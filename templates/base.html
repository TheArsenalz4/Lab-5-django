<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sitio de CVs{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #212529;
            background: #f8f9fa;
            line-height: 1.6;
        }
        header, footer { background: #212529; color: #f1f3f5; padding: 1rem 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        header h1 { margin: 0; font-size: 1.25rem; }
        nav a { color: #f1f3f5; text-decoration: none; margin-left: 1rem; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        footer { text-align: center; font-size: 0.875rem; }

        /* Página de CV */
        .cv-tarjeta { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); overflow: hidden; }
        .cv-tarjeta section { padding: 1.25rem 2rem; border-top: 1px solid #e9ecef; }
        .cv-tarjeta h3 { margin: 0 0 0.75rem; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.08em; color: #495057; }
        .cv-encabezado { background: #212529; color: #f1f3f5; padding: 2rem; }
        .cv-encabezado h2 { margin: 0; font-size: 1.75rem; }
        .cv-titulo { margin: 0.25rem 0 0; color: #adb5bd; font-size: 1.1rem; }
        .cv-contacto ul { list-style: none; margin: 0; padding: 0; }
        .cv-habilidades ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .habilidad { background: #e7f1ff; color: #0a58ca; border-radius: 999px; padding: 0.2rem 0.85rem; font-size: 0.9rem; font-weight: 500; }
        .experiencia-item { border-left: 3px solid #0d6efd; padding-left: 1rem; margin-bottom: 1.25rem; }
        .experiencia-item:last-child { margin-bottom: 0; }
        .experiencia-item h4 { margin: 0; font-size: 1.05rem; }
        .experiencia-item p { margin: 0.25rem 0 0; }
        .experiencia-lugar { color: #6c757d; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Sitio de CVs</h1>
        <nav>
            <a href="{% url 'home' %}">Inicio</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Laboratorio 5 &mdash; Programación de Aplicaciones &middot; Universidad Central, Sede Coquimbo</p>
    </footer>
</body>
</html>
